<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Lineups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CS2 LINEUPS — tokens
   ============================================================ */
:root{
  --bg0:#0A0D12; --bg1:#11161E; --bg2:#19202B; --bg3:#222B38;
  --ink:#E9EEF5; --mut:#8E9AAB;
  --line:rgba(141,160,184,.16); --line-soft:rgba(141,160,184,.09);
  --smoke:#EDF2F8; --flash:#FFD75E; --molotov:#FF6B45; --he:#7ED491;
  --t:#F0A33C; --ct:#6FA8E8; --danger:#FF5C5C;
  --disp:"Chakra Petch",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg0);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background-image:linear-gradient(rgba(141,160,184,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(141,160,184,.035) 1px,transparent 1px);
  background-size:44px 44px}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg0);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(240,163,60,.45);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
::placeholder{color:#5C6878}
:focus-visible{outline:2px solid rgba(240,163,60,.55);outline-offset:2px}
img{display:block}

/* ============================================================ HEADER */
header{height:54px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);
  background:rgba(13,17,24,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:50}
.brand{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--t)}
.brand:hover{opacity:.85}
.hdr-map{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:10px}
.hdr-map:not(:empty)::before{content:"/";color:#3B4656}
.hdr-spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);
  transition:border-color .15s,background .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:#3E4B5E;background:var(--bg3)}
.btn:active{transform:translateY(1px)}
.btn-amber{background:var(--t);border-color:var(--t);color:#1A1206}
.btn-amber:hover{background:#F7B257;border-color:#F7B257}
.btn-ghost{background:transparent}
.btn-flag{padding:5px 8px;display:flex;align-items:center;justify-content:center;border-radius:4px;overflow:hidden}
.btn-flag svg{display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.btn-danger{color:var(--danger);border-color:rgba(255,92,92,.4)}
.btn-danger:hover{background:rgba(255,92,92,.1);border-color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:11.5px}
.icon-btn{width:27px;height:27px;flex:0 0 auto;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mut);border:1px solid transparent;font-size:13px}
.icon-btn:hover{color:var(--ink);background:var(--bg3);border-color:var(--line)}
.icon-btn.danger:hover{color:var(--danger)}

/* ============================================================ LOCALBAR */
.localbar{display:none;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 18px 0;padding:10px 14px;
  background:rgba(240,163,60,.08);border:1px solid rgba(240,163,60,.35);border-radius:8px;font-size:13px}
.localbar.show{display:flex}
.localbar .txt{flex:1;min-width:200px;color:#E8C58C}

/* ============================================================ HOME */
#home{max-width:1060px;margin:0 auto;padding:46px 22px 80px}
.home-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--t);margin-bottom:10px}
.home-title{font-family:var(--disp);font-weight:700;font-size:clamp(26px,4vw,38px);letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.home-sub{color:var(--mut);margin-top:4px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:lowercase}
.map-grid{margin-top:34px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.map-card{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--bg1);overflow:hidden;text-align:left;transition:border-color .15s,transform .15s}
.map-card:hover{border-color:var(--t);transform:translateY(-2px)}
.map-card-thumb{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(240,163,60,.06),transparent 70%),var(--bg0);position:relative;overflow:hidden}
.map-card-thumb img{max-width:74%;max-height:78%;object-fit:contain;opacity:.95;transition:transform .25s,opacity .15s;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.map-card:hover .map-card-thumb img{transform:scale(1.05);opacity:1}
.map-card-thumb.is-radar img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover;opacity:.92;filter:none}
.map-card-body{padding:11px 14px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line-soft)}
.map-card-name{font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:.14em;text-transform:uppercase}
.map-card-count{font-family:var(--mono);font-size:12px;color:var(--mut)}
.map-card-count b{color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){.map-card{transition:none}}

/* ============================================================ VIEWER LAYOUT */
#viewer{display:none}
.stage{display:grid;grid-template-columns:236px minmax(440px,1fr) clamp(380px,30vw,540px);gap:14px;align-items:start;padding:14px 18px 60px}

/* ---- left rail ---- */
.rail{position:sticky;top:68px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 90px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#39455A transparent;padding-right:2px}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:#39455A;border-radius:4px}
.rail-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.rail-box{border:1px solid var(--line);border-radius:var(--r);background:var(--bg1);padding:12px}

.modeswitch{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modeswitch button{flex:1;padding:8px 4px;font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.modeswitch button.on{background:var(--bg3);color:var(--ink);box-shadow:inset 0 -2px 0 var(--t)}

.fgrid{display:flex;gap:6px;flex-wrap:wrap}
.fgrid-sides{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-soft)}
.fico{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#5C6878;transition:all .12s;position:relative}
.fico svg{width:17px;height:17px}
.fico.on{color:var(--c);border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent)}
.fico.side{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.03em}

.xcard{display:block;width:100%;text-align:left;border:1px solid var(--line-soft);border-radius:8px;background:var(--bg2);padding:9px 11px;transition:border-color .12s}
.xcard + .xcard{margin-top:7px}
.xcard:hover{border-color:#46556B}
.xcard.on{border-color:var(--t)}
.xcard .xtop{display:flex;align-items:center;gap:8px}
.xcard .xname{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xcard .xdesc{font-size:12px;color:var(--mut);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xcard .xmeta{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:4px}
.sidedot{flex:0 0 auto;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid}
.sidedot.T{color:var(--t);border-color:rgba(240,163,60,.5)}
.sidedot.CT{color:var(--ct);border-color:rgba(111,168,232,.5)}
.buychip{flex:0 0 auto;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mut)}
.rail-empty{font-size:12.5px;color:var(--mut)}
.rail-clear{font-family:var(--mono);font-size:11px;color:var(--t);margin-top:8px}
.rail-clear:hover{text-decoration:underline}

/* ---- map ---- */
.map-col{min-width:0}
.mapframe{position:relative;width:100%;max-width:min(80vh,840px);margin:0 auto;padding:13px}
.mapframe::before,.mapframe::after,.mapframe .ck1,.mapframe .ck2{content:"";position:absolute;width:24px;height:24px;border:2px solid var(--t);opacity:.8}
.mapframe::before{top:0;left:0;border-right:none;border-bottom:none}
.mapframe::after{top:0;right:0;border-left:none;border-bottom:none}
.mapframe .ck1{bottom:46px;left:0;border-right:none;border-top:none}
.mapframe .ck2{bottom:46px;right:0;border-left:none;border-top:none}
.mapwrap{position:relative;width:100%;aspect-ratio:1/1;background:var(--bg1);border:1px solid var(--line);border-radius:6px;overflow:hidden;touch-action:none}
.mapwrap img.radar{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.mapwrap.placing{cursor:crosshair}
.mapwrap.drawing{cursor:crosshair}
svg.traj{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:4}
.traj path{fill:none;stroke-width:.5;stroke-dasharray:1.4 1.4;opacity:1;animation:trajDash 1.4s linear infinite}
@keyframes trajDash{from{stroke-dashoffset:0}to{stroke-dashoffset:-5.6}}
#drawcanvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.mapwrap.drawing #drawcanvas{pointer-events:auto;z-index:20}

/* markers */
.mk{position:absolute;transform:translate(-50%,-50%);width:25px;height:25px;z-index:6;display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .15s}
/* When lineups are open, dim everything else */
.has-open .mk:not(.sel){opacity:.35;transform:translate(-50%,-50%) scale(.85)}
.has-open .mk:not(.sel):hover{opacity:.75;transform:translate(-50%,-50%) scale(1)}
/* Stacked marker (multiple utils at same spot) */
.mk-stack{position:absolute;transform:translate(-50%,-50%);z-index:6;display:flex;gap:0;transition:opacity .15s}
.mk-stack .mk{position:relative;transform:none;width:22px;height:22px}
.mk-stack .mk:not(:first-child){margin-left:-7px}
.mk-stack .mk .diamond{width:20px;height:20px}
.has-open .mk-stack:not(.sel-stack){opacity:.35}
.has-open .mk-stack:not(.sel-stack):hover{opacity:.75}
.mk-stack.sel-stack{z-index:8}
.mk .diamond{position:absolute;inset:3px;transform:rotate(45deg);background:rgba(10,13,18,.88);border:1.6px solid var(--c);border-radius:3px;
  box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 9px -2px var(--c)}
.mk svg{position:relative;width:13px;height:13px;color:var(--c)}
.mk:hover{z-index:9}
.mk:hover .diamond,.mk.sel .diamond{background:var(--c)}
.mk:hover svg,.mk.sel svg{color:#0A0D12}
.mk.sel{z-index:8}
.mk.sel .diamond{box-shadow:0 0 0 3px rgba(233,238,245,.18),0 0 14px -2px var(--c)}
.mk.dim{opacity:.42;pointer-events:none}
.mk .stepnum{position:absolute;top:-7px;right:-7px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:500;background:var(--t);color:#1A1206;border-radius:99px}
/* throw cross */
.mk-throw{position:absolute;transform:translate(-50%,-50%);width:12px;height:12px;z-index:5;pointer-events:none;
  filter:drop-shadow(0 0 2px rgba(0,0,0,.9))}
.mk-throw::before,.mk-throw::after{content:"";position:absolute;background:var(--c);left:50%;top:50%}
.mk-throw::before{width:1.6px;height:12px;transform:translate(-50%,-50%)}
.mk-throw::after{width:12px;height:1.6px;transform:translate(-50%,-50%)}
.editmode .mk-throw{pointer-events:auto;cursor:grab}
.editmode .mk{cursor:grab}
/* strategy zone marker */
.mk-zone{position:absolute;transform:translate(-50%,-50%);z-index:6;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  min-width:30px;height:30px;padding:0 9px;border-radius:99px;border:1.6px solid var(--t);color:var(--t);background:rgba(10,13,18,.88);
  box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 10px -2px var(--t);transition:all .12s}
.mk-zone:hover,.mk-zone.sel{background:var(--t);color:#1A1206;z-index:9}
.mk-zone.CT{border-color:var(--ct);color:var(--ct);box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 10px -2px var(--ct)}
.mk-zone.CT:hover,.mk-zone.CT.sel{background:var(--ct);color:#0A0D12}
.editmode .mk-zone{cursor:grab}

.coords{display:none}
.placing-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:21;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:var(--t);color:#1A1206;padding:6px 14px;border-radius:99px;display:none;white-space:nowrap}
.mapwrap.placing .placing-hint{display:block}
.map-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--mut);padding:30px;z-index:2}
.map-empty .big{font-family:var(--disp);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}

/* map tools (draw) */
.maptools{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:9px;height:32px}
.mt-btn{height:30px;min-width:30px;padding:0 8px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);color:var(--mut);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--mono);font-size:11.5px}
.mt-btn:hover{color:var(--ink);border-color:#46556B}
.mt-btn.on{color:#fff;background:#D8372F;border-color:#D8372F}

/* lineup cards (multi-open, draggable) */
.lcard{border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:12px;transition:border-color .12s,opacity .12s}
.lcard.collapsed .lcard-body{display:none}
.lcard-toggle{font-size:10px;color:var(--mut);width:20px;height:20px}
.lcard-toggle:hover{color:var(--ink)}
.lcard.dragging{opacity:.45}
.lcard.dragover{border-color:var(--t);box-shadow:0 -2px 0 var(--t)}
.lcard-head{display:flex;align-items:center;gap:8px;cursor:grab}
.lcard-head:active{cursor:grabbing}
.lcard-head .ic{width:15px;height:15px;flex:0 0 auto;display:flex}
.lcard .grip{color:#5C6878;font-size:13px;flex:0 0 auto;user-select:none}
.lcard-name{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;flex:1;min-width:0}
.lcard-tech{font-family:var(--mono);font-size:11.5px;color:var(--ink);background:var(--bg0);border:1px solid var(--line);padding:4px 9px;border-radius:5px;display:inline-block;margin-top:9px}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:121;width:42px;height:42px;border-radius:50%;
  background:var(--bg1);border:1px solid var(--line);color:var(--ink);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.lb-nav:hover{border-color:var(--t);color:var(--t)}
#lb-prev{left:16px}
#lb-next{right:16px}
#lb-cap{font-family:var(--mono);font-size:12px;color:var(--mut)}

/* ---- right panel ---- */
.panel{position:sticky;top:68px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg1);
  max-height:calc(100vh - 90px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#39455A transparent}
.panel::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb{background:#39455A;border-radius:4px}
.dr-pad{padding:18px}
.dr-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dr-title{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.03em;line-height:1.2;text-transform:uppercase}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:5px;border:1px solid var(--line);color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.type-smoke{color:var(--smoke);border-color:rgba(237,242,248,.4)}
.badge.type-flash{color:var(--flash);border-color:rgba(255,215,94,.4)}
.badge.type-molotov{color:var(--molotov);border-color:rgba(255,107,69,.4)}
.badge.type-he{color:var(--he);border-color:rgba(126,212,145,.4)}
.badge.side-T{color:var(--t);border-color:rgba(240,163,60,.45)}
.badge.side-CT{color:var(--ct);border-color:rgba(111,168,232,.45)}
.badge.tech{font-family:var(--mono);font-weight:500;letter-spacing:.03em;text-transform:none;color:var(--ink)}

/* throw-technique icon chips */
.tk-row{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.tk-block{display:flex;flex-direction:column;gap:5px}
.tk-row{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.tk{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;
  background:#1A1E25;color:#E8ECF2;border:none}
.tk svg{width:20px;height:20px}
.tk-sm .tk{width:22px;height:22px;border-radius:4px}
.tk-sm .tk svg{width:14px;height:14px}
.tk-label{display:inline-block;padding:5px 10px;border-radius:6px;background:#1A1E25;color:#E8ECF2;
  font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:capitalize}
.tk-note{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-left:2px}
.tk-sm .tk-note{font-size:10px}
.tech-preview{margin-top:8px;min-height:32px}
.tech-preview:empty{display:none}

/* legend (bottom-right) */
.legend{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.legend-toggle{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(17,22,30,.92);backdrop-filter:blur(8px);color:var(--mut)}
.legend-toggle:hover{color:var(--ink);border-color:#46556B}
.legend-toggle .lg-key{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid currentColor;font-size:11px}
.legend-body{display:none;width:236px;max-height:60vh;overflow-y:auto;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(17,22,30,.96);backdrop-filter:blur(10px);box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.legend.open .legend-body{display:block}
.legend.open .legend-toggle{color:var(--ink);border-color:var(--t)}
.lg-h{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.lg-h:not(:first-child){margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.lg-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
.lg-item{display:flex;align-items:center;gap:7px;font-size:12px;color:#C2CBD8}
.lg-ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 auto;border-radius:5px;border:1px solid var(--line);background:var(--bg0);color:var(--ink)}
.lg-ic svg{width:14px;height:14px}
@media (max-width:1200px){.legend{right:10px;bottom:10px}.legend-body{width:210px}}
.dr-desc{color:#C2CBD8;margin-top:14px;white-space:pre-wrap}
.dr-h{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.media-grid{display:grid;grid-template-columns:1fr;gap:10px}
.media-item{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg0);cursor:zoom-in;padding:0;width:100%}
.media-item img,.media-item video{width:100%;display:block}
.media-item .cap{font-size:12px;color:var(--mut);padding:7px 10px;border-top:1px solid var(--line-soft);text-align:left;font-family:var(--mono)}

/* Variant tabs in lineup card */
.varbadge{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--t);color:#1A1206;font-family:var(--mono);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;border:1.5px solid var(--bg0)}
.var-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0;padding:6px;background:var(--bg0);border:1px solid var(--line-soft);border-radius:7px}
.var-tab{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:5px 11px;border-radius:5px;background:transparent;color:var(--mut);border:1px solid transparent;cursor:pointer;text-transform:uppercase;white-space:nowrap}
.var-tab:hover{color:var(--ink);background:var(--bg2)}
.var-tab.on{background:var(--t);color:#1A1206;border-color:var(--t)}

/* Execute player in right panel */
.exec-player{margin-top:14px;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--line)}

.exec-player img{cursor:zoom-in}

/* Editor media row layout */
.media-toolbar{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.m-row{display:flex !important;align-items:center;gap:8px;padding:8px;background:var(--bg2);border:1px solid var(--line-soft);border-radius:8px}
.m-thumb{width:48px;height:48px;flex:0 0 48px;border-radius:6px;overflow:hidden;background:var(--bg0);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.m-thumb img,.m-thumb video{width:100%;height:100%;object-fit:cover}
.m-thumb-ph{color:var(--mut);font-family:var(--mono);font-size:18px}
.m-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.m-fields input{width:100%;padding:5px 8px;font-size:12.5px}
.m-acts{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.m-acts .icon-btn{width:24px;height:24px;font-size:12px}
.media-item.media-err{cursor:default;border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.05);min-height:120px}
.media-item.media-err img,.media-item.media-err video{display:none}
.media-item.media-err .cap{display:none}
.media-err-msg{padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.media-err-msg .ic{font-size:22px;color:var(--danger);line-height:1}
.media-err-msg .path{font-family:var(--mono);font-size:11.5px;color:var(--danger);word-break:break-all;line-height:1.45;max-width:100%}
.media-err-msg .hint{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut)}
.tips{list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{display:flex;gap:9px;color:#C2CBD8;font-size:13.5px;background:var(--bg2);border:1px solid var(--line-soft);border-radius:7px;padding:9px 11px}
.tips li::before{content:"▸";color:var(--t);flex:0 0 auto}
.dr-empty{color:var(--mut);padding:26px 18px;text-align:center}
.dr-empty .big{font-family:var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:6px}
.linkrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;transition:border-color .12s,background .12s}
.linkrow + .linkrow{margin-top:7px}
.linkrow.on{border-color:var(--t);background:rgba(240,163,60,.06)}
.linkrow .chev{margin-left:auto;font-size:11px;color:var(--mut);font-family:var(--mono)}
.linkrow.on .chev{color:var(--t)}

.linkrow.nested .n{background:var(--bg2);color:var(--mut)}
.strat-inline{margin:6px 0 10px;padding:10px 11px 12px;background:var(--bg0);border-left:2px solid var(--t);border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:8px}
.strat-inline:empty{display:none}
.strat-inline .media-grid{margin-top:0}
.strat-inline .tips{margin:0}
.strat-steps{display:flex;flex-direction:column;gap:0}
.linkrow:hover{border-color:#46556B}
.linkrow .n{font-family:var(--mono);font-size:11px;flex:0 0 22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--t);color:#1A1206;border-radius:50%}
.linkrow .ic{width:14px;height:14px;flex:0 0 auto;display:flex}
.linkrow .nm{font-weight:500;font-size:13.5px;flex:1;min-width:0}
.linkrow .sub{font-family:var(--mono);font-size:10.5px;color:var(--mut)}

/* ============================================================ EDITOR */
.ed-tabs{display:flex;border-bottom:1px solid var(--line)}
.ed-tab{flex:1;padding:11px 4px;font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid transparent}
.ed-tab.on{color:var(--ink);border-bottom-color:var(--t)}
.ed-list{display:flex;flex-direction:column;gap:6px}
.ed-row{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;transition:transform .15s,border-color .15s}
.ed-row.dragging{opacity:.45}

.ed-row .ic{width:14px;height:14px;flex:0 0 auto;display:flex}
.ed-row .nm{flex:1;min-width:0;text-align:left;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;background:none;border:none;color:var(--ink);padding:0}
.ed-row .sd{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
.f-label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.f-row{display:flex;gap:8px}
.f-row>*{flex:1}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:6px 11px;border-radius:6px;border:1px solid var(--line);color:var(--mut)}
.seg button.on{color:var(--ink);background:var(--bg3);border-color:#5A6B83}

.seg button[data-v="flash"].on{color:var(--flash)}
.seg button[data-v="molotov"].on{color:var(--molotov)}

.seg button[data-v="T"].on{color:var(--t);border-color:rgba(240,163,60,.5)}

.place-btns{display:flex;gap:8px;flex-wrap:wrap}
.place-btns .btn{flex:1;justify-content:center;min-width:120px}
.place-btns .btn.arming{background:var(--t);border-color:var(--t);color:#1A1206}
.sub-list{display:flex;flex-direction:column;gap:7px}
.sub-row{display:flex;gap:7px;align-items:center}
.sub-row input{flex:1}
.add-line{font-family:var(--mono);font-size:12px;color:var(--t);margin-top:8px;padding:4px 0}
.add-line:hover{text-decoration:underline}
.f-hint{font-size:12px;color:var(--mut);margin-top:5px}
.ed-foot{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.exsel{display:flex;flex-direction:column;gap:6px;max-height:250px;overflow-y:auto}
.exsel label{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line-soft);border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px}
.exsel input{width:auto}
.exsel .num{font-family:var(--mono);font-size:10.5px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:var(--t);color:#1A1206;border-radius:50%}
.exsel .ic{width:13px;height:13px;display:inline-flex}

/* ============================================================ EXEC OVERLAY */

/* ============================================================ MODAL / LIGHTBOX / TOAST */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .back{position:absolute;inset:0;background:rgba(5,7,10,.7);backdrop-filter:blur(2px)}
.modal .box{position:relative;width:min(460px,100%);background:var(--bg1);border:1px solid var(--line);border-radius:12px;padding:20px;max-height:88vh;overflow-y:auto}
.modal .box h3{font-family:var(--disp);font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.modal .box .mbody{color:var(--mut);margin-bottom:16px;font-size:13.5px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#lightbox{position:fixed;top:0;left:0;right:0;bottom:0;z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,7,10,.92);padding:22px;gap:12px}
#lightbox.show{display:flex}
@media(min-width:1100px){#lightbox.show{right:clamp(380px,30vw,540px)}}
#lb-info{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(10,13,18,.85);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:90%;pointer-events:none;z-index:122}
#lb-info:empty{display:none}
#lb-info .lb-name{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
#lb-info .lb-tech{display:flex;gap:4px;align-items:center}

/* Thumbnail strip below image */
#lb-strip{display:flex;gap:8px;justify-content:center;padding:4px;flex-wrap:wrap;max-width:90vw}
#lb-strip:empty{display:none}
.lb-thumb{width:70px;height:46px;border-radius:6px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex:0 0 auto;background:#000;transition:border-color .12s}
.lb-thumb:hover{border-color:rgba(240,163,60,.5)}
.lb-thumb.on{border-color:var(--t)}
.lb-thumb img,.lb-thumb video{width:100%;height:100%;object-fit:cover}

/* When lightbox is open, collapse cards in the right panel to just headers */
body.lb-open .lcard-body{display:none}
body.lb-open .lcard{cursor:pointer}
body.lb-open .lcard:hover{border-color:var(--t)}
body.lb-open .lcard.lb-active{border-color:var(--t);background:rgba(240,163,60,.08)}
#lb-media{display:flex;align-items:center;justify-content:center;min-height:0;flex:0 1 auto;max-width:96vw}
#lb-media img,#lb-media video,#lb-media canvas{max-width:96vw;max-height:82vh;border-radius:8px;display:block}
#lb-bar{display:flex;align-items:center;gap:12px;background:var(--bg1);border:1px solid var(--line);border-radius:99px;padding:8px 16px;max-width:96vw}
#lb-bar.hidden{display:none}
#lb-play{width:34px;height:34px;border-radius:50%;background:var(--smoke);color:#0A0D12;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
#lb-seek{width:min(420px,52vw);accent-color:var(--t);padding:0;border:none;background:transparent}
#lb-time{font-family:var(--mono);font-size:11.5px;color:var(--mut);white-space:nowrap}
#lb-close{position:fixed;top:14px;right:16px;z-index:121;font-size:18px;color:var(--mut);width:36px;height:36px;border-radius:50%;background:var(--bg1);border:1px solid var(--line)}
#lb-close:hover{color:var(--ink)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);z-index:130;background:var(--bg3);border:1px solid var(--line);color:var(--ink);
  font-family:var(--disp);font-size:13px;letter-spacing:.05em;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================ RESPONSIVE */
@media (max-width:1200px){
  .stage{grid-template-columns:1fr;padding:12px 12px 50px}
  .rail{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .rail>*{flex:1 1 280px}
  .panel{position:static;max-height:none}
  .mapframe{max-width:none}
  header{padding:0 12px;gap:10px}
  .hdr-map{display:none}
}
</style>

/* ============================================================
   CS2 LINEUPS — app (EN/FR, lineups + executes + strategies,
   drawing layer, GitHub publish)
   ============================================================ */

const MAPS=[
  {id:"mirage",name:"Mirage"},{id:"inferno",name:"Inferno"},{id:"overpass",name:"Overpass"},

  {id:"dust2",name:"Dust 2"},{id:"train",name:"Train"},
];
const TYPES={
  smoke:{label:"Smoke",color:"#EDF2F8"},
  flash:{label:"Flash",color:"#FFD75E"},
  molotov:{label:"Molotov",color:"#FF6B45"},

};
const ICONS={
  smoke:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 18a4.5 4.5 0 0 1-.6-8.96 6 6 0 0 1 11.7-.84A4.3 4.3 0 0 1 17.7 18H6.5z"/></svg>`,
  flash:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 1.5 4 14h6l-1.5 8.5L18 10h-6l1.5-8.5z"/></svg>`,
  molotov:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.8c1.3 3.6-3.4 5.4-3.4 9.2a3.4 3.4 0 0 0 6.8 0c0-1.3-.6-2.4-1.2-3.3 2.6 1.1 4.6 3.3 4.6 6.4A6.8 6.8 0 0 1 12 22.3a6.8 6.8 0 0 1-6.8-6.7C5.2 9.9 10.4 7.5 12 1.8z"/></svg>`,
  he:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l1.9 4.7L18 3.5l-1.2 4.3L21.5 9l-3.6 3 3.6 3-4.7 1.2L18 20.5l-4.1-2.2L12 23l-1.9-4.7L6 20.5l1.2-4.3L2.5 15l3.6-3-3.6-3 4.7-1.2L6 3.5l4.1 2.2L12 1z"/></svg>`,
};

/* ---------------- throw-technique tokens → icons ----------------
   A technique string like "Left and right click + W + Jumpthrow"
   is split on "+" and each part matched to a token below. Anything
   in (parentheses) is kept as a small text note. */
/* ---- Technique system (csnades.gg style) ---- */
/* Row 1 = CLICK (icons: mouse + optional jump arrow) */
/* Row 2 = MOVEMENT (text label only: Stationary, Running, Walking, Wtap, Crouched) */

const MOUSE_LEFT=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v2.5"/><path d="M5.5 10.5a6.5 6.5 0 0 1 13 0v5.5a6.5 6.5 0 0 1-13 0z"/><line x1="12" y1="4.5" x2="12" y2="10.5"/><line x1="5.5" y1="10.5" x2="18.5" y2="10.5"/><rect x="5.5" y="4.5" width="6.5" height="6" rx="3.25" fill="currentColor" stroke="none" opacity=".55"/></svg>`;
const MOUSE_RIGHT=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v2.5"/><path d="M5.5 10.5a6.5 6.5 0 0 1 13 0v5.5a6.5 6.5 0 0 1-13 0z"/><line x1="12" y1="4.5" x2="12" y2="10.5"/><line x1="5.5" y1="10.5" x2="18.5" y2="10.5"/><rect x="12" y="4.5" width="6.5" height="6" rx="3.25" fill="currentColor" stroke="none" opacity=".55"/></svg>`;
const MOUSE_LR=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v2.5"/><path d="M5.5 10.5a6.5 6.5 0 0 1 13 0v5.5a6.5 6.5 0 0 1-13 0z"/><line x1="12" y1="4.5" x2="12" y2="10.5"/><line x1="5.5" y1="10.5" x2="18.5" y2="10.5"/><rect x="5.5" y="4.5" width="6.5" height="6" rx="3.25" fill="currentColor" stroke="none" opacity=".55"/><rect x="12" y="4.5" width="6.5" height="6" rx="3.25" fill="currentColor" stroke="none" opacity=".55"/></svg>`;
const MOUSE_PLAIN=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v2.5"/><path d="M5.5 10.5a6.5 6.5 0 0 1 13 0v5.5a6.5 6.5 0 0 1-13 0z"/><line x1="12" y1="4.5" x2="12" y2="10.5"/><line x1="5.5" y1="10.5" x2="18.5" y2="10.5"/></svg>`;
const JUMP_ARROW=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20V6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M6 12l6-8 6 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* Click tokens (shown as icons in row 1) */
const TECH_CLICK=[
  {id:"jump", test:p=>/jump ?throw|jumpthrow/.test(p), svg:JUMP_ARROW, en:"Jumpthrow",fr:"Jumpthrow"},
  {id:"lr",   test:p=>/left and right|both click|left ?\+ ?right/.test(p), svg:MOUSE_LR, en:"Left + right click",fr:"Clic G+D"},
  {id:"right",test:p=>/right click|rightclick/.test(p), svg:MOUSE_RIGHT, en:"Right click",fr:"Clic droit"},
  {id:"left", test:p=>/left click|leftclick/.test(p), svg:MOUSE_LEFT, en:"Left click",fr:"Clic gauche"},
  {id:"throw",test:p=>/\bthrow\b/.test(p), svg:MOUSE_LEFT, en:"Throw",fr:"Lancer"},
];

/* Movement tokens (shown as text labels in row 2) */
const TECH_MOVE=[
  {id:"stand", test:p=>/stationary|standing|stand|still/.test(p), en:"Stationary",fr:"Immobile"},
  {id:"crouch",test:p=>/crouch|duck/.test(p), en:"Crouched",fr:"Accroupi"},
  {id:"walk",  test:p=>/walk|shift/.test(p), en:"Walking",fr:"Marcher"},
  {id:"run",   test:p=>/run|running/.test(p), en:"Running",fr:"Courir"},
  {id:"w",     test:p=>/wtap|w tap|\bw\b|forward/.test(p), en:"Wtap",fr:"Wtap"},
];

const TECH_TOKENS=[...TECH_CLICK,...TECH_MOVE];
const STRIP_RE={};
TECH_TOKENS.forEach(tk=>{
  const src=tk.test.toString();
  const m=src.match(/\/(.+)\//);
  if(m)try{STRIP_RE[tk.id]=new RegExp(m[1],"i");}catch(e){}
});
function parseTech(str){
  if(!str)return {tokens:[],note:""};
  let note="";
  const clean=str.replace(/\(([^)]*)\)/g,(_,n)=>{note=note?note+" · "+n.trim():n.trim();return " ";});
  const parts=clean.split(/\+|,|&/).map(s=>s.trim()).filter(Boolean);
  const tokens=[]; const seen=new Set();
  const add=tk=>{if(!seen.has(tk.id)){seen.add(tk.id);tokens.push(tk);}};
  for(const part of parts){
    let p=part.toLowerCase();
    let matchedAny=false;
    for(const tk of TECH_TOKENS){
      if(tk.test(p)){add(tk);matchedAny=true;
        if(STRIP_RE[tk.id])p=p.replace(STRIP_RE[tk.id]," ");
      }
    }
    if(!matchedAny&&part&&!note)note=part;
  }
  // Implicit: jumpthrow or throw always needs a mouse click shown
  const hasClick=tokens.some(t=>["lr","left","right","throw"].includes(t.id));
  if(!hasClick&&tokens.some(t=>t.id==="jump")){
    // Jumpthrow → add left click
    const lc=TECH_CLICK.find(t=>t.id==="left");if(lc)add(lc);
  }
  if(!hasClick&&!tokens.some(t=>t.id==="jump")&&tokens.length>0){
    // Has movement but no click at all → add left click (default throw)
    const lc=TECH_CLICK.find(t=>t.id==="left");if(lc)add(lc);
  }
  // If only click tokens and no movement → add stationary
  const clickIds=new Set(TECH_CLICK.map(t=>t.id));
  const hasMoveToken=tokens.some(t=>!clickIds.has(t.id));
  if(tokens.length>0&&!hasMoveToken){
    const st=TECH_MOVE.find(t=>t.id==="stand");if(st)add(st);
  }
  return {tokens,note};
}
function techIconsHTML(str,size="md"){
  try{
    const {tokens,note}=parseTech(str);
    if(!tokens.length&&!note) return "";
    const clickIds=new Set(TECH_CLICK.map(t=>t.id));
    const clickTokens=tokens.filter(t=>clickIds.has(t.id));
    const moveTokens=tokens.filter(t=>!clickIds.has(t.id));
    const chip=tk=>{
      const lbl=esc(LANG==="fr"?tk.fr:tk.en);
      return `<span class="tk" title="${lbl}">${tk.svg}</span>`;
    };
    const moveLbl=tk=>{
      const lbl=LANG==="fr"?tk.fr:tk.en;
      return `<span class="tk-label">${esc(lbl)}</span>`;
    };
    if(size==="sm"){
      // Compact: icons only, single row
      const labels=moveTokens.map(tk=>LANG==="fr"?tk.fr:tk.en).join(" · ");
      return `<span class="tk-row tk-sm">${clickTokens.map(chip).join("")}${labels?`<span class="tk-note">${esc(labels)}</span>`:""}</span>`;
    }
    let html="";
    if(clickTokens.length) html+=`<div class="tk-row">${clickTokens.map(chip).join("")}</div>`;
    if(moveTokens.length) html+=`<div class="tk-row">${moveTokens.map(moveLbl).join("")}</div>`;
    if(note) html+=`<span class="tk-note">${esc(note)}</span>`;
    return `<div class="tk-block">${html}</div>`;
  }catch(e){return `<span class="tk-note">${esc(str)}</span>`;}
}

function num(v,f){const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):f}

function emptyDb(){
  const maps={};
  MAPS.forEach(m=>maps[m.id]={lineups:[],executes:[],strats:[],instas:[],drawings:[]});
  return {version:3,maps};
}
function migrate(data){
  const db=emptyDb();
  if(!data||typeof data!=="object"||!data.maps) return db;
  for(const [mid,md] of Object.entries(data.maps)){
    db.maps[mid]={
      lineups:Array.isArray(md.lineups)?md.lineups.map(normLineup):[],
      executes:Array.isArray(md.executes)?md.executes.map(normExec):[],
      strats:Array.isArray(md.strats)?md.strats.map(normStrat):[],
      instas:Array.isArray(md.instas)?md.instas.map(normInsta):[],
      drawings:Array.isArray(md.drawings)?md.drawings.filter(d=>d&&Array.isArray(d.strokes)):[],
    };
  }
  return db;
}
function normLineup(l){
  return {
    id:l.id||uid(), name:l.name||"Unnamed",
    type:TYPES[l.type]?l.type:"smoke", side:(l.side==="CT")?"CT":"T",
    technique:l.technique||"", description:l.description||"",
    target:typeof l.target==="string"?l.target.trim():"",
    variant:typeof l.variant==="string"?l.variant.trim():"",
    cluster:typeof l.cluster==="string"?l.cluster.trim():"",
    land:{x:num(l.land?.x,50),y:num(l.land?.y,50)},
    throw:{x:num(l.throw?.x,50),y:num(l.throw?.y,60)},
    media:Array.isArray(l.media)?l.media.filter(m=>m&&m.url).map(m=>({url:m.url,label:m.label||""})):[],
    tips:Array.isArray(l.tips)?l.tips.filter(Boolean):[],
  };
}
function normExec(e){
  return {id:e.id||uid(),name:e.name||"Execute",side:(e.side==="CT")?"CT":"T",
    description:e.description||"",
    media:Array.isArray(e.media)?e.media.filter(m=>m&&m.url).map(m=>({url:m.url,label:m.label||""})):[],
    tips:Array.isArray(e.tips)?e.tips.filter(Boolean):[],
    items:Array.isArray(e.items)?e.items:[]};
}
function normStrat(s){
  return {id:s.id||uid(),name:s.name||"Strategy",side:(s.side==="CT")?"CT":"T",
    zone:s.zone||"",
    point:(s.point&&Number.isFinite(+s.point.x))?{x:num(s.point.x,50),y:num(s.point.y,50)}:null,
    description:s.description||"",
    media:Array.isArray(s.media)?s.media.filter(m=>m&&m.url).map(m=>({url:m.url,label:m.label||""})):[],
    tips:Array.isArray(s.tips)?s.tips.filter(Boolean):[],
    items:Array.isArray(s.items)?s.items.filter(i=>i&&i.id&&(i.kind==="lineup"||i.kind==="exec")):[]};
}
function normInsta(n){
  return {id:n.id||uid(),name:n.name||"Insta",side:(n.side==="CT")?"CT":"T",
    description:n.description||"",
    image:typeof n.image==="string"?n.image.trim():"",

    throw:{x:num(n.throw?.x,50),y:num(n.throw?.y,60)}};
}

  placing:null,                  // land | throw | spoint
  drawMode:false, strokes:[], curStroke:null,
};
function mapData(){
  if(!state.db.maps[state.map]) state.db.maps[state.map]={lineups:[],executes:[],strats:[],drawings:[]};
  const md=state.db.maps[state.map];
  md.strats=md.strats||[]; md.drawings=md.drawings||[];
  return md;
}

/* ---------------- boot ---------------- */
(async function boot(){
  try{
    const res=await fetch("data.json",{cache:"no-store"});
    if(res.ok){state.db=migrate(await res.json());}
  }catch(e){}
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const localDb=migrate(JSON.parse(raw));
      // Count total lineups in each source
      let localN=0, fileN=0;
      for(const m of Object.values(localDb.maps)) localN+=m.lineups.length;
      for(const m of Object.values(state.db.maps))  fileN+=m.lineups.length;
      if(localN>=fileN){
        // localStorage is up-to-date or has user edits on top → use it
        state.db=localDb; state.usingLocal=true;
      } else {
        // localStorage is stale (old demo data) → discard silently
        localStorage.removeItem(STORE_KEY);
        localStorage.removeItem(SNAP_KEY);
        console.info("[cs2] Stale localStorage cleared — using data.json ("+fileN+" lineups)");
      }
    }
  }catch(e){console.warn("invalid local data",e);}
  bindGlobal();
  renderChrome();
  routeFromHash();
})();

/* ---------------- persistence / publish ---------------- */
function save(){
  state.usingLocal=true;
  localStorage.setItem(STORE_KEY,JSON.stringify(state.db));
  updateLocalbar();
}
function isDirty(){
  if(!state.usingLocal) return false;
  const snap=localStorage.getItem(SNAP_KEY);
  return localStorage.getItem(STORE_KEY)!==snap;
}
function updateLocalbar(){ $("#localbar").classList.toggle("show",isDirty()); }
function exportJSON(){
  const blob=new Blob([JSON.stringify(state.db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="data.json"; a.click();
  URL.revokeObjectURL(a.href);
  toast(t("tExported"));
}
function importJSON(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(data&&data.maps){ state.db=migrate(data); save(); toast(t("tImported")); renderAll(); return; }
      if(data&&(Array.isArray(data.lineups)||Array.isArray(data.executes))){
        if(!state.map){toast(t("tOpenMapFirst"));return;}
        const md=mapData();
        const conv=(data.lineups||[]).map(convertOldLineup);
        const convEx=(data.executes||[]).map(normExec);
        const byId=new Map(md.lineups.map(l=>[l.id,l]));
        conv.forEach(l=>byId.set(l.id,l));
        md.lineups=Array.from(byId.values());
        const exById=new Map(md.executes.map(e=>[e.id,e]));
        convEx.forEach(e=>exById.set(e.id,e));
        md.executes=Array.from(exById.values());
        save(); toast(`${conv.length} lineups + ${convEx.length} executes → ${state.map}`); renderAll(); return;
      }
      toast(t("tUnknownFmt"));
    }catch(e){toast(t("tBadFile"));}
  };
  reader.readAsText(file);
}
function convertOldLineup(l){
  if(!l||typeof l!=="object") return normLineup({});
  if(l.land&&l.media) return normLineup(l);
  const variant=String(l.variant||"").trim();
  const base=[l.spot,l.name].map(s=>String(s||"").trim()).filter(Boolean).join(" — ")||l.id||"Unnamed";
  const name=variant?`${base} (${variant})`:base;
  const fix=p=>String(p).replace(/^images\//,"media/");
  const imgs=l.images||{}; const media=[];
  const single=imgs.single||imgs.one;
  if(imgs.stand) media.push({url:fix(imgs.stand),label:"Stand"});
  if(imgs.aim) media.push({url:fix(imgs.aim),label:"Aim"});
  if(single&&single!==imgs.stand&&single!==imgs.aim) media.push({url:fix(single),label:""});
  return normLineup({
    id:l.id,name,type:l.type,side:l.side,
    technique:String(l.description||"").trim(),description:"",
    land:{x:l.x,y:l.y},throw:l.throw||{x:l.x,y:(Number(l.y)||50)+10},
    media,tips:[],
  });
}

/* GitHub publish */
function ghCfg(){try{return JSON.parse(localStorage.getItem(GH_KEY)||"null")}catch(e){return null}}
function slugify(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);}
function extOf(file){const m=(file.name||"").match(/\.([a-z0-9]+)$/i);return m?m[1].toLowerCase():"bin";}
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const s=r.result||"";res(String(s).split(",")[1]||"");};
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
function buildMediaPath(mapId,prefix,file){
  const ext=extOf(file);
  const slug=slugify(prefix)||"media";
  const stamp=Date.now().toString(36).slice(-5);
  return `media/${mapId}/${slug}-${stamp}.${ext}`;
}
async function uploadFileToGitHub(file,targetPath){
  const cfg=ghCfg();
  if(!cfg||!cfg.token||!cfg.owner||!cfg.repo){
    throw new Error(LANG==="fr"?"Configure d'abord la publication (token GitHub)":"Configure Publish first (GitHub token)");
  }
  const maxBytes=24*1024*1024; // GitHub Contents API limit is ~25MB after base64 inflation
  if(file.size>maxBytes) throw new Error((LANG==="fr"?"Fichier trop lourd (max 24 Mo) : ":"File too large (max 24 MB): ")+(file.size/1024/1024).toFixed(1)+" MB");
  const base64=await fileToBase64(file);
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${targetPath}`;
  const headers={"Authorization":`Bearer ${cfg.token}`,"Accept":"application/vnd.github+json"};
  let sha=null;
  try{const g=await fetch(`${url}?ref=${encodeURIComponent(cfg.branch)}`,{headers,cache:"no-store"});if(g.ok)sha=(await g.json()).sha;}catch(e){}
  const body={message:`Upload ${targetPath}`,content:base64,branch:cfg.branch};
  if(sha) body.sha=sha;
  const r=await fetch(url,{method:"PUT",headers,body:JSON.stringify(body)});
  if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.message||("HTTP "+r.status));}
  return targetPath;
}
function openPublishModal(){
  const c=ghCfg()||{owner:"",repo:"",branch:"main",token:""};
  showModal({
    title:t("pubT"),
    html:`<p style="margin-bottom:12px">${esc(t("pubIntro"))}</p>
      <label class="f-label" style="margin-top:0">${esc(t("owner"))}</label><input id="gh-owner" value="${esc(c.owner)}" placeholder="mqhx">
      <label class="f-label">${esc(t("repo"))}</label><input id="gh-repo" value="${esc(c.repo)}" placeholder="CS2-Lineups-V2">
      <label class="f-label">${esc(t("branch"))}</label><input id="gh-branch" value="${esc(c.branch||"main")}">
      <label class="f-label">${esc(t("token"))}</label><input id="gh-token" type="password" value="${esc(c.token)}" placeholder="github_pat_…">
      <p class="f-hint" style="margin-top:8px">${esc(t("tokenHint"))}</p>`,
    buttons:[
      {label:t("cancel"),cls:"btn"},
      {label:t("pubSave"),cls:"btn btn-amber",onClick:async()=>{
        const cfg={owner:$("#gh-owner").value.trim(),repo:$("#gh-repo").value.trim(),
                   branch:$("#gh-branch").value.trim()||"main",token:$("#gh-token").value.trim()};
        localStorage.setItem(GH_KEY,JSON.stringify(cfg));
        await doPublish(cfg);
      }},
    ],
  });
}
async function publish(){
  const cfg=ghCfg();
  if(!cfg||!cfg.token||!cfg.owner||!cfg.repo){openPublishModal();return;}
  await doPublish(cfg);
}
async function doPublish(cfg){
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`;
  const headers={"Authorization":`Bearer ${cfg.token}`,"Accept":"application/vnd.github+json"};
  try{
    let sha=null;
    const g=await fetch(`${url}?ref=${encodeURIComponent(cfg.branch)}`,{headers,cache:"no-store"});
    if(g.ok){sha=(await g.json()).sha;}
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(state.db,null,2))));
    const body={message:"Update lineups via site editor",content,branch:cfg.branch};
    if(sha) body.sha=sha;
    const p=await fetch(url,{method:"PUT",headers,body:JSON.stringify(body)});
    if(!p.ok){const err=await p.json().catch(()=>({}));throw new Error(err.message||p.status);}
    localStorage.setItem(SNAP_KEY,localStorage.getItem(STORE_KEY)||JSON.stringify(state.db));
    updateLocalbar();
    toast(t("pubOk"));
  }catch(e){ toast(t("pubErr")+e.message); }
}

function visibleLineups(){

  return md.lineups.filter(l=>{
    if(!state.filters.types.has(l.type))return false;
    if(!state.filters.sides.has(l.side))return false;
    if(q){const hay=(l.name+" "+l.technique+" "+l.description+" "+l.tips.join(" ")).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function visibleStrats(){
  const md=mapData();
  const q=state.filters.q.trim().toLowerCase();
  return md.strats.filter(s=>{
    if(!state.filters.sides.has(s.side))return false;
    if(q){const hay=(s.name+" "+s.zone+" "+s.description).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}

      z.textContent=g.zone;
      z.title=g.strats.map(s=>s.name).join(" / ");
      if(g.strats.length>1){
        const badge=document.createElement("span");
        badge.className="varbadge";badge.textContent=g.strats.length;
        z.appendChild(badge);
      }
      z.addEventListener("click",e=>{e.stopPropagation();
        if(g.strats.length===1){
          const s=g.strats[0];
          state.selectedStrat=(state.selectedStrat===s.id)?null:s.id;
          state.stratExpand=new Set();renderAll();
        }else{
          // Cycle through strats in the zone group, or deselect
          const curIdx=g.strats.findIndex(s=>state.selectedStrat===s.id);
          if(curIdx>=0 && curIdx===g.strats.length-1){state.selectedStrat=null;}
          else{state.selectedStrat=g.strats[(curIdx+1)%g.strats.length].id;}
          state.stratExpand=new Set();renderAll();
        }
      });
      box.appendChild(z);
    });
    return;
  }
  if(state.viewMode==="strats" && state.editMode){
    // in edit mode strat tab: show all strat points draggable
    md.strats.forEach(s=>{
      if(!s.point)return;
      const z=document.createElement("button");
      z.className="mk-zone "+s.side+(state.editingStratId===s.id?" sel":"");
      z.style.left=s.point.x+"%"; z.style.top=s.point.y+"%";
      z.textContent=s.zone||s.name.slice(0,6); z.title=s.name;
      z.addEventListener("click",e=>{e.stopPropagation();startEditStrat(s.id);});
      enableDrag(z,s,"point");
      box.appendChild(z);
    });
    return;
  }

  const vis=visibleLineups();
  const exec=state.activeExec?md.executes.find(e=>e.id===state.activeExec):null;
  const order=exec?exec.items:null;

  // Group lineups + instas by target field (variants share a marker)
  // Instas are treated as type:"smoke" for display
  const allItems=[...vis];
  if(!order && md.instas){
    md.instas.forEach(n=>{
      // Wrap insta as a lineup-like object for rendering
      if(state.filters.sides.size && !state.filters.sides.has(n.side))return;
      if(state.filters.types.size && !state.filters.types.has("smoke"))return;
      allItems.push({...n,type:"smoke",technique:"",media:n.image?[{url:n.image,label:n.name}]:[],tips:[],_isInsta:true});
    });
  }
  const groups=new Map();
  const groupKey=l=>l.target?l.target.toLowerCase():l.id;
  allItems.forEach(l=>{
    const k=groupKey(l);
    if(!groups.has(k))groups.set(k,[]);
    groups.get(k).push(l);
  });

  groups.forEach(variants=>{
    // When an exec is active, only show groups that include a variant in the exec
    let activeVariant=variants[0];
    if(order){
      const inExecV=variants.find(v=>order.includes(v.id));
      if(!inExecV)return;
      activeVariant=inExecV;
    }else if(state.editMode&&state.editingId){
      const editing=variants.find(v=>v.id===state.editingId);
      if(editing)activeVariant=editing;
    }else{
      const opened=variants.find(v=>state.openIds.includes(v.id));
      if(opened)activeVariant=opened;
    }
    const l=activeVariant;
    const selected=!!order||variants.some(v=>state.openIds.includes(v.id));
    const c=TYPES[l.type].color;
    const mk=document.createElement("button");
    mk.className="mk"+(selected?" sel":"");
    mk.style.setProperty("--c",c);
    mk.style.left=l.land.x+"%"; mk.style.top=l.land.y+"%";
    if(l.cluster)mk.dataset.cluster=l.cluster.toLowerCase();
    mk.title=l.name+(variants.length>1?` (${variants.length} variantes)`:"");
    mk.innerHTML=`<span class="diamond"></span>${ICONS[l.type]}`;
    if(variants.length>1&&!order){
      const v=document.createElement("span");
      v.className="varbadge";v.textContent=variants.length;
      mk.appendChild(v);
    }
    if(order){
      const n=document.createElement("span");
      n.className="stepnum";n.textContent=order.indexOf(l.id)+1;
      mk.appendChild(n);
    }
    mk.addEventListener("click",e=>{
      e.stopPropagation();
      if(state.editMode){
        if(l._isInsta){state.editingInstaId=l.id;state.edTab="instas";renderAll();}
        else startEditLineup(l.id);
        return;
      }
      // Toggle the active variant for the group
      const openedV=variants.find(v=>state.openIds.includes(v.id));
      if(openedV){
        state.openIds=state.openIds.filter(x=>x!==openedV.id);
      }else{
        state.openIds.push(l.id);
      }
      renderAll();
    });
    mk.addEventListener("mouseenter",()=>{
      // No hover trajectory — trajectories only shown for opened lineups
    });
    mk.addEventListener("mouseleave",()=>renderSelectedTraj());
    if(state.editMode)enableDrag(mk,l,"land");
    box.appendChild(mk);

    if(selected||(state.editMode&&state.editingId===l.id)){
      const tm=document.createElement("div");
      tm.className="mk-throw";
      tm.style.setProperty("--c",c);
      tm.style.left=l.throw.x+"%"; tm.style.top=l.throw.y+"%";
      if(state.editMode)enableDrag(tm,l,"throw");
      box.appendChild(tm);
    }
  });

  // Insta markers in editor mode (editable, draggable)
  if(!order && state.editMode && state.edTab==="instas"){
    const instas=md.instas||[];
    instas.forEach(n=>{
      const sel=state.editingInstaId===n.id;
      const mk=document.createElement("button");
      mk.className="mk"+(sel?" sel":"");
      mk.style.setProperty("--c","#EDF2F8");
      mk.style.left=n.land.x+"%";mk.style.top=n.land.y+"%";
      mk.title=n.name;
      mk.innerHTML=`<span class="diamond"></span>${ICONS.smoke}`;
      mk.addEventListener("click",e=>{e.stopPropagation();state.editingInstaId=n.id;renderAll();});
      enableDrag(mk,n,"land");
      box.appendChild(mk);
      if(sel){
        const tm=document.createElement("div");
        tm.className="mk-throw";tm.style.setProperty("--c","#EDF2F8");
        tm.style.left=n.throw.x+"%";tm.style.top=n.throw.y+"%";
        enableDrag(tm,n,"throw");
        box.appendChild(tm);
      }
    });
  }

  // Post-process: stack markers that share an explicit "cluster" value (manual grouping)
  const mks=[...box.querySelectorAll(".mk:not(.mk-throw)")];
  const byCluster=new Map();
  mks.forEach((mk,i)=>{
    const c=mk.dataset.cluster;
    if(!c)return;
    if(!byCluster.has(c))byCluster.set(c,[]);
    byCluster.get(c).push(i);
  });
  byCluster.forEach(idxs=>{
    if(idxs.length<2)return;
    // Stack at the position of the first marker
    const first=mks[idxs[0]];
    const x=parseFloat(first.style.left),y=parseFloat(first.style.top);
    const wrap=document.createElement("div");
    wrap.className="mk-stack";
    wrap.style.left=x+"%";wrap.style.top=y+"%";
    const anySel=idxs.some(idx=>mks[idx].classList.contains("sel"));
    if(anySel)wrap.classList.add("sel-stack");
    idxs.forEach(idx=>{
      mks[idx].style.left="0";mks[idx].style.top="0";
      wrap.appendChild(mks[idx]);
    });
    box.appendChild(wrap);
  });

  renderSelectedTraj();
}
function trajPath(l){
  const paths=$("#trajpaths");
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",`M ${l.throw.x} ${l.throw.y} L ${l.land.x} ${l.land.y}`);
  p.setAttribute("stroke",TYPES[l.type].color);
  p.setAttribute("marker-end",`url(#arr-${l.type})`);
  paths.appendChild(p);
}
function renderSelectedTraj(){
  $("#trajpaths").innerHTML="";
  if(state.viewMode!=="lineups")return;
  const md=mapData();
  if(state.editMode){
    const l=md.lineups.find(x=>x.id===state.editingId);
    if(l)trajPath(l);
    const n=md.instas.find(x=>x.id===state.editingInstaId);
    if(n)instaTrajectory(n);
    return;
  }
  state.openIds.forEach(id=>{
    const l=md.lineups.find(x=>x.id===id);
    if(l){trajPath(l);return;}
    const n=(md.instas||[]).find(x=>x.id===id);
    if(n)instaTrajectory(n);
  });
  if(state.activeInsta){
    const n=md.instas.find(x=>x.id===state.activeInsta);
    if(n)instaTrajectory(n);
  }
}
function instaTrajectory(n){
  const paths=$("#trajpaths");
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",`M ${n.throw.x} ${n.throw.y} L ${n.land.x} ${n.land.y}`);
  p.setAttribute("stroke","#EDF2F8");
  paths.appendChild(p);
}
function enableDrag(el,obj,key){
  el.addEventListener("pointerdown",e=>{
    if(!state.editMode)return;
    e.preventDefault();e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    const move=ev=>{
      const p=mapPoint(ev);
      obj[key]=obj[key]||{};
      obj[key].x=p.x;obj[key].y=p.y;
      el.style.left=p.x+"%";el.style.top=p.y+"%";
      if(key!=="point")renderSelectedTraj();
    };
    const up=()=>{el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);save();
      const co=$("#f-coords");
      if(co&&obj.land&&obj.throw)co.textContent=`${t("impact")} ${obj.land.x}, ${obj.land.y} · ${t("throwLbl")} ${obj.throw.x}, ${obj.throw.y}`;
    };
    el.addEventListener("pointermove",move);
    el.addEventListener("pointerup",up);
  });
}
function mapPoint(ev){
  const r=$("#mapwrap").getBoundingClientRect();
  let x=((ev.clientX-r.left)/r.width)*100, y=((ev.clientY-r.top)/r.height)*100;
  return {x:+Math.max(0,Math.min(100,x)).toFixed(2),y:+Math.max(0,Math.min(100,y)).toFixed(2)};
}

/* ---------------- right panel ---------------- */
function renderPanel(){
  const panel=$("#panel");
  if(state.editMode){renderEditor(panel);return;}
  const md=mapData();

  if(state.viewMode==="strats"){
    const s=state.selectedStrat?md.strats.find(x=>x.id===state.selectedStrat):null;
    if(s){renderStratDetail(panel,s);return;}
    panel.innerHTML=`<div class="dr-empty"><div class="big">${esc(t("briefing"))}</div>
      <p>${esc(md.strats.length?t("briefStrat"):t("noStrats"))}</p></div>`;
    return;
  }

  if(state.openIds.length){
    const findItem=id=>{
      const l=md.lineups.find(x=>x.id===id);
      if(l)return l;
      const n=(md.instas||[]).find(x=>x.id===id);
      if(n)return {...n,type:"smoke",technique:"",media:n.image?[{url:n.image,label:n.name}]:[],tips:[],_isInsta:true};
      return null;
    };
    const open=state.openIds.map(findItem).filter(Boolean);
    if(open.length!==state.openIds.length)state.openIds=open.map(l=>l.id);
    panel.innerHTML=`
      <div class="dr-pad" style="display:flex;flex-direction:column;gap:11px">
        <div class="dr-eyebrow" style="margin-bottom:0"><span>${open.length} ${open.length===1?esc(t("lineupCnt")):esc(t("lineupsCnt"))}</span>
          <button class="icon-btn" id="dr-closeall" title="${esc(t("close"))}">✕</button></div>
        ${open.map(l=>lineupCardHTML(l)).join("")}
      </div>`;
    $("#dr-closeall").addEventListener("click",()=>{state.openIds=[];renderAll();});
    panel.querySelectorAll(".lcard").forEach(card=>{
      const id=card.dataset.id;
      const l=findItem(id);
      // When lightbox is open, clicking a card switches the lightbox to that lineup
      card.addEventListener("click",e=>{
        if(!document.body.classList.contains("lb-open"))return;
        if(e.target.closest(".lcard-close,.lcard-toggle,.var-tab,.media-item"))return;
        if(l&&l.media&&l.media.length)openLightbox(l.media,0,{id:l.id,name:l.name,technique:l.technique||""});
      });
      card.querySelector(".lcard-close").addEventListener("click",e=>{
        e.stopPropagation();
        state.openIds=state.openIds.filter(x=>x!==id);state.collapsedCards.delete(id);renderAll();
      });
      card.querySelector(".lcard-toggle").addEventListener("click",e=>{
        e.stopPropagation();
        if(state.collapsedCards.has(id))state.collapsedCards.delete(id);
        else state.collapsedCards.add(id);
        renderAll();
      });
      if(l)card.querySelectorAll(".media-item").forEach((el,i)=>el.addEventListener("click",()=>openLightbox(l.media,i,{id:l.id,name:l.name,technique:l.technique||""})));
      card.querySelectorAll(".var-tab").forEach(tab=>tab.addEventListener("click",e=>{
        e.stopPropagation();
        const vid=tab.dataset.var;
        if(vid===id)return; // already showing
        // Replace the current openId with the chosen variant
        const idx=state.openIds.indexOf(id);
        if(idx>=0)state.openIds[idx]=vid;else state.openIds.push(vid);
        renderAll();
      }));
      card.addEventListener("dragstart",e=>{
        e.dataTransfer.setData("text/plain",id);
        e.dataTransfer.effectAllowed="move";
        card.classList.add("dragging");
      });
      card.addEventListener("dragend",()=>{
        card.classList.remove("dragging");
        panel.querySelectorAll(".lcard").forEach(c=>c.classList.remove("dragover"));
      });
      card.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";card.classList.add("dragover");});
      card.addEventListener("dragleave",()=>card.classList.remove("dragover"));
      card.addEventListener("drop",e=>{
        e.preventDefault();card.classList.remove("dragover");
        const src=e.dataTransfer.getData("text/plain");
        if(!src||src===id)return;
        const arr=state.openIds.filter(x=>x!==src);
        arr.splice(arr.indexOf(id),0,src);
        state.openIds=arr;
        renderPanel();
      });
    });
    return;
  }

  /* Insta view */
  if(state.activeInsta){
    const n=md.instas&&md.instas.find(x=>x.id===state.activeInsta);
    if(n){
      panel.innerHTML=`
        <div class="dr-pad">
          <div class="dr-eyebrow"><span>Insta // ${esc(n.side)}</span>
            <button class="icon-btn" id="dr-close" title="${esc(t("close"))}">✕</button></div>
          <h2 class="dr-title">${esc(n.name)}</h2>
          <div class="badges"><span class="badge side-${n.side}">${n.side}</span></div>
          ${n.image?`<div class="media-grid" style="margin-top:14px">
            <button class="media-item" type="button"><img src="${esc(n.image)}" data-src="${esc(n.image)}" alt="${esc(n.name)}" loading="lazy"></button>
          </div>`:`<div class="exec-novideo">${esc(t("instaHint"))}</div>`}
          ${n.description?`<p class="dr-desc">${esc(n.description)}</p>`:""}
        </div>`;
      $("#dr-close").addEventListener("click",()=>{state.activeInsta=null;renderAll();});
      if(n.image){
        panel.querySelector(".media-item").addEventListener("click",()=>openLightbox([{url:n.image,label:n.name}],0));
      }
      return;
    }
  }

  if(state.activeExec){
    const ex=md.executes.find(e=>e.id===state.activeExec);
    if(ex){
      const hasMedia=ex.media&&ex.media.length;
      panel.innerHTML=`
        <div class="dr-pad">
          <div class="dr-eyebrow"><span>Execute // ${esc(ex.side)} · ${ex.items.length} ${esc(t("steps"))}</span>
            <button class="icon-btn" id="dr-close" title="${esc(t("close"))}">✕</button></div>
          <h2 class="dr-title">${esc(ex.name)}</h2>
          <div class="badges">
            <span class="badge side-${ex.side}">${ex.side}</span>
          </div>
          ${hasMedia?`<div class="media-grid" style="margin-top:14px">${ex.media.map(m=>mediaHTML(m)).join("")}</div>`:`<div class="exec-novideo">${esc(t("noVideo"))}</div>`}
          ${ex.description?`<p class="dr-desc">${esc(ex.description)}</p>`:""}
          ${ex.tips&&ex.tips.length?`<div class="dr-h">${esc(t("tips"))}</div><ul class="tips">${ex.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
          ${ex.items.length?`<div class="dr-h">${esc(t("steps"))}</div>`:""}
          ${ex.items.map((id,i)=>{
            const l=md.lineups.find(x=>x.id===id);if(!l)return"";
            return `<button class="linkrow" data-id="${l.id}">
              <span class="n">${i+1}</span>
              <span class="ic" style="color:${TYPES[l.type].color}">${ICONS[l.type]}</span>
              <span class="nm">${esc(l.name)}</span>
              <span class="sub">${l.technique?techIconsHTML(l.technique,"sm"):esc(TYPES[l.type].label)}</span></button>`;
          }).join("")}
        </div>`;
      $("#dr-close").addEventListener("click",()=>{state.activeExec=null;renderAll();});
      panel.querySelectorAll(".media-item").forEach((el,i)=>el.addEventListener("click",()=>openLightbox(ex.media,i)));
      panel.querySelectorAll(".linkrow").forEach(b=>b.addEventListener("click",()=>{
        if(!state.openIds.includes(b.dataset.id))state.openIds.push(b.dataset.id);
        renderAll();
      }));
      return;
    }
  }

  panel.innerHTML=`<div class="dr-empty"><div class="big">${esc(t("briefing"))}</div>
    <p>${esc(md.lineups.length?t("briefText"):t("briefEmpty"))}</p></div>`;
}

function lineupCardHTML(l){
  const md=mapData();
  let siblings=[l];
  if(l.target){
    const tk=l.target.toLowerCase();
    const fromLineups=md.lineups.filter(x=>x.target&&x.target.toLowerCase()===tk);
    const fromInstas=(md.instas||[]).filter(x=>x.target&&x.target.toLowerCase()===tk)
      .map(n=>({...n,type:"smoke",technique:"",media:n.image?[{url:n.image,label:n.name}]:[],tips:[],_isInsta:true}));
    siblings=[...fromLineups,...fromInstas];
  }
  const hasVariants=siblings.length>1;
  const tabsHTML=hasVariants?`<div class="var-tabs">${
    siblings.map(v=>`<button class="var-tab ${v.id===l.id?"on":""}" data-var="${esc(v.id)}">${esc(v.variant||(v._isInsta?"Insta":v.id.slice(0,5)))}</button>`).join("")
  }</div>`:"";
  const collapsed=state.collapsedCards&&state.collapsedCards.has(l.id);
  return `<div class="lcard ${collapsed?"collapsed":""}" draggable="true" data-id="${esc(l.id)}">
    <div class="lcard-head">
      <span class="grip" title="Drag">⠿</span>
      <span class="ic" style="color:${TYPES[l.type].color}">${ICONS[l.type]}</span>
      <span class="lcard-name">${esc(l.name)}</span>
      <span class="sidedot ${l.side}">${l.side}</span>
      <button class="icon-btn lcard-toggle" title="Reduce">${collapsed?"▸":"▾"}</button>
      <button class="icon-btn lcard-close" title="${esc(t("close"))}">✕</button>
    </div>
    <div class="lcard-body">
      ${tabsHTML}
      ${l.technique?`<div class="lcard-tech">${techIconsHTML(l.technique)}</div>`:""}
      ${l.description?`<p class="dr-desc" style="margin-top:8px;font-size:13px">${esc(l.description)}</p>`:""}
      ${l.media.length?`<div class="media-grid" style="margin-top:10px">${l.media.map(m=>mediaHTML(m)).join("")}</div>`:""}
      ${l.tips.length?`<ul class="tips" style="margin-top:10px">${l.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    </div>
  </div>`;
}

function renderStratDetail(panel,s){
  const md=mapData();
  panel.innerHTML=`
    <div class="dr-pad">
      <div class="dr-eyebrow"><span>${esc(t("modeStrats"))} // ${esc(s.side)}</span>
        <button class="icon-btn" id="dr-close" title="${esc(t("close"))}">✕</button></div>
      <h2 class="dr-title">${esc(s.name)}</h2>
      <div class="badges">
        <span class="badge side-${s.side}">${s.side}</span>
        ${s.zone?`<span class="badge tech">${esc(s.zone)}</span>`:""}
      </div>
      ${s.description?`<p class="dr-desc">${esc(s.description)}</p>`:""}
      ${s.media&&s.media.length?`<div class="media-grid" style="margin-top:10px" id="strat-media">${s.media.map(m=>mediaHTML(m)).join("")}</div>`:""}
      ${s.tips&&s.tips.length?`<ul class="tips" style="margin-top:10px">${s.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${s.items.length?`<div class="dr-h">${esc(t("linked"))}</div>${
        s.items.map((it,i)=>{
          const expanded=state.stratExpand.has(it.id);
          if(it.kind==="exec"){
            const ex=md.executes.find(x=>x.id===it.id);if(!ex)return"";
            return `<button class="linkrow ${expanded?"on":""}" data-toggle="${ex.id}" data-kind="exec">
              <span class="n">${i+1}</span><span class="ic" style="color:var(--t)">⚙</span>
              <span class="nm">${esc(ex.name)}</span><span class="sub">EXEC · ${ex.items.length}</span>
              <span class="chev">${expanded?"▾":"▸"}</span></button>
              ${expanded?renderExecInline(ex,md):""}`;
          }
          const l=md.lineups.find(x=>x.id===it.id);if(!l)return"";
          return `<button class="linkrow ${expanded?"on":""}" data-toggle="${l.id}" data-kind="lineup">
            <span class="n">${i+1}</span>
            <span class="ic" style="color:${TYPES[l.type].color}">${ICONS[l.type]}</span>
            <span class="nm">${esc(l.name)}</span><span class="sub">${l.technique?techIconsHTML(l.technique,"sm"):esc(TYPES[l.type].label)}</span>
            <span class="chev">${expanded?"▾":"▸"}</span></button>
            ${expanded?renderLineupInline(l):""}`;
        }).join("")}`:""}
    </div>`;
  $("#dr-close").addEventListener("click",()=>{state.selectedStrat=null;state.stratExpand=new Set();renderAll();});
  // Toggle expand on linkrow click
  panel.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.toggle;
    if(state.stratExpand.has(id))state.stratExpand.delete(id);else state.stratExpand.add(id);
    renderAll();
  }));
  // Wire media clicks inside the inline expanded sections (open lightbox without leaving the strat view)
  s.items.forEach(it=>{
    if(!state.stratExpand.has(it.id))return;
    const wrap=panel.querySelector(`.strat-inline[data-for="${it.id}"]`);
    if(!wrap)return;
    let mediaArr=[];

/* Upload helper: open file picker, upload to GitHub, attach to obj.media */
function pickAndUploadMedia(obj,prefix,replaceIdx,onDone){
  const inp=document.createElement("input");
  inp.type="file";
  inp.accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm";
  inp.onchange=async e=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    const path=buildMediaPath(state.map,prefix,file);
    toast(t("uploading"));
    try{
      await uploadFileToGitHub(file,path);
      if(replaceIdx!=null&&replaceIdx>=0){
        const old=obj.media[replaceIdx]||{label:""};
        obj.media[replaceIdx]={url:path,label:old.label||""};
      }else{
        obj.media.push({url:path,label:""});
      }
      save();
      toast(t("uploadOk"));
      if(onDone)onDone();
    }catch(err){
      console.error("upload",err);
      toast(t("uploadFail")+(err.message||err));
    }
  };
  inp.click();
}

/* Wire drag-and-drop reordering on a list of .ed-row elements. arr is the underlying array (md.lineups, md.executes, md.strats). */
function wireListDragSort(listEl,arr){
  let srcIdx=null;
  listEl.querySelectorAll(".ed-row").forEach((row,idx)=>{
    row.setAttribute("draggable","true");
    row.dataset.idx=idx;
    row.addEventListener("dragstart",e=>{
      srcIdx=idx;
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain",String(idx));
      row.classList.add("dragging");
    });
    row.addEventListener("dragend",()=>{
      listEl.querySelectorAll(".ed-row").forEach(r=>r.classList.remove("dragging","drag-over"));
    });
    row.addEventListener("dragover",e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      listEl.querySelectorAll(".ed-row").forEach(r=>r.classList.remove("drag-over"));
      row.classList.add("drag-over");
    });
    row.addEventListener("drop",e=>{
      e.preventDefault();
      row.classList.remove("drag-over");
      const tgt=+row.dataset.idx;
      if(srcIdx==null||srcIdx===tgt)return;
      const [item]=arr.splice(srcIdx,1);
      arr.splice(tgt,0,item);
      save();renderAll();
    });
  });
}
