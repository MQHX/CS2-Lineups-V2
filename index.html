/* ============================================================
   DRAWING LAYER
   ============================================================ */
const canvas=$("#drawcanvas");
const ctx=canvas.getContext("2d");
function resizeCanvas(){
  const wrap=$("#mapwrap");
  const r=wrap.getBoundingClientRect();
  if(!r.width)return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(r.width*dpr);
  canvas.height=Math.round(r.height*dpr);
  redrawStrokes();
}
new ResizeObserver(resizeCanvas).observe($("#mapwrap"));
function redrawStrokes(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle="rgba(255,62,52,.95)";
  ctx.lineWidth=Math.max(3,canvas.width/300);
  ctx.shadowColor="rgba(0,0,0,.7)";ctx.shadowBlur=2;
  const W=canvas.width,H=canvas.height;
  for(const st of state.strokes){
    if(st.length<2)continue;
    ctx.beginPath();
    ctx.moveTo(st[0].x/100*W,st[0].y/100*H);
    for(let i=1;i<st.length;i++)ctx.lineTo(st[i].x/100*W,st[i].y/100*H);
    ctx.stroke();
  }
}
canvas.addEventListener("pointerdown",e=>{
  if(!state.drawMode)return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  state.curStroke=[mapPoint(e)];
  state.strokes.push(state.curStroke);
});
canvas.addEventListener("pointermove",e=>{
  if(!state.drawMode||!state.curStroke)return;
  state.curStroke.push(mapPoint(e));
  redrawStrokes();
});
canvas.addEventListener("pointerup",()=>{state.curStroke=null;});
canvas.addEventListener("pointercancel",()=>{state.curStroke=null;});

function renderMapTools(){
  const box=$("#maptools");
  box.innerHTML=`
    <button class="mt-btn ${state.drawMode?"on":""}" id="mt-draw" title="${esc(t("drawTip"))}">${esc(t("draw"))}</button>
    <button class="mt-btn" id="mt-undo" title="${esc(t("undoTip"))}">${esc(t("undo"))}</button>
    <button class="mt-btn" id="mt-clear" title="${esc(t("clearTip"))}">${esc(t("clear"))}</button>`;
  $("#mt-draw").addEventListener("click",()=>{
    state.drawMode=!state.drawMode;
    $("#mapwrap").classList.toggle("drawing",state.drawMode);
    renderMapTools();
  });
  $("#mt-undo").addEventListener("click",()=>{state.strokes.pop();redrawStrokes();});
  $("#mt-clear").addEventListener("click",()=>{state.strokes=[];redrawStrokes();});
}

/* ============================================================
   LIGHTBOX — gallery with media controls
   ============================================================ */
let lbState={kind:null,el:null,frozen:false,canvas:null};
let lbGal={items:[],idx:0};
let lbWheelLock=0;
function fmtTime(s){if(!Number.isFinite(s))return"0:00";const m=Math.floor(s/60),x=Math.floor(s%60);return m+":"+String(x).padStart(2,"0");}
function openLightbox(items,idx=0,ctx=null){
  if(!items)return;
  if(!Array.isArray(items))items=[items];
  items=items.filter(m=>m&&m.url);
  if(!items.length)return;
  lbGal={items,idx:Math.max(0,Math.min(idx,items.length-1)),ctx};
  renderLightbox();
  $("#lightbox").classList.add("show");
  document.body.classList.add("lb-open");
  // Mark the active card in the right panel
  if(ctx&&ctx.id){
    document.querySelectorAll(".lcard").forEach(c=>{
      c.classList.toggle("lb-active",c.dataset.id===ctx.id);
    });
  }
}
function renderLightbox(){
  const m=lbGal.items[lbGal.idx];
  const media=$("#lb-media"),bar=$("#lb-bar"),play=$("#lb-play"),seek=$("#lb-seek"),time=$("#lb-time");
  media.innerHTML="";lbState={kind:null,el:null,frozen:false,canvas:null};
  if(isVideo(m.url)){
    const v=document.createElement("video");
    v.src=m.url;v.loop=true;v.playsInline=true;v.autoplay=true;
    media.appendChild(v);
    lbState={kind:"video",el:v};
    bar.classList.remove("hidden");seek.style.display="";time.style.display="";
    play.textContent="❚❚";
    v.addEventListener("loadedmetadata",()=>{time.textContent=`0:00 / ${fmtTime(v.duration)}`;});
    v.addEventListener("timeupdate",()=>{
      if(v.duration){seek.value=Math.round(v.currentTime/v.duration*1000);
        time.textContent=`${fmtTime(v.currentTime)} / ${fmtTime(v.duration)}`;}
    });
  }else{
    const img=document.createElement("img");
    img.src=m.url;img.alt=m.label||"";
    media.appendChild(img);
    if(isGif(m.url)){
      lbState={kind:"gif",el:img};
      bar.classList.remove("hidden");
      seek.style.display="none";time.style.display="none";
      play.textContent="❚❚";
    }else{
      bar.classList.add("hidden");
    }
  }
  const multi=lbGal.items.length>1;
  $("#lb-prev").style.display=multi?"":"none";
  $("#lb-next").style.display=multi?"":"none";
  const cap=$("#lb-cap");
  const parts=[];
  if(m.label)parts.push(m.label);
  if(multi)parts.push(`${lbGal.idx+1} / ${lbGal.items.length}`);
  cap.textContent=parts.join("  ·  ");
  cap.style.display=parts.length?"":"none";
  // Show lineup context info
  const info=$("#lb-info");
  if(info){
    if(lbGal.ctx){
      let h=`<span class="lb-name">${esc(lbGal.ctx.name||"")}</span>`;
      if(lbGal.ctx.technique)h+=`<div class="lb-tech">${techIconsHTML(lbGal.ctx.technique,"sm")}</div>`;
      info.innerHTML=h;
    }else info.innerHTML="";
  }
  // Generate thumbnail strip (only if more than 1 item)
  const strip=$("#lb-strip");
  if(strip){
    if(lbGal.items.length>1){
      strip.innerHTML=lbGal.items.map((m,i)=>{
        const inner=isVideo(m.url)
          ?`<video src="${esc(m.url)}" muted></video>`
          :`<img src="${esc(m.url)}" alt="" loading="lazy">`;
        return `<div class="lb-thumb ${i===lbGal.idx?"on":""}" data-idx="${i}">${inner}</div>`;
      }).join("");
      strip.querySelectorAll(".lb-thumb").forEach(t=>t.addEventListener("click",e=>{
        e.stopPropagation();
        const i=+t.dataset.idx;
        if(i!==lbGal.idx){lbGal.idx=i;renderLightbox();}
      }));
    }else strip.innerHTML="";
  }
}
function lbStep(d){
  if(lbGal.items.length<2)return;
  const v=$("#lb-media video");if(v)v.pause();
  lbGal.idx=(lbGal.idx+d+lbGal.items.length)%lbGal.items.length;
  renderLightbox();
}
function closeLightbox(){
  const v=$("#lb-media video");if(v)v.pause();
  $("#lightbox").classList.remove("show");
  $("#lb-media").innerHTML="";
  document.body.classList.remove("lb-open");
  document.querySelectorAll(".lcard.lb-active").forEach(c=>c.classList.remove("lb-active"));
}
$("#lb-close").addEventListener("click",closeLightbox);
$("#lb-prev").addEventListener("click",e=>{e.stopPropagation();lbStep(-1);});
$("#lb-next").addEventListener("click",e=>{e.stopPropagation();lbStep(1);});
$("#lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox"||e.target.id==="lb-media")closeLightbox();});
$("#lightbox").addEventListener("wheel",e=>{
  e.preventDefault();
  const now=Date.now();
  if(now-lbWheelLock<260)return;
  lbWheelLock=now;
  lbStep(e.deltaY>0?1:-1);
},{passive:false});
$("#lb-play").addEventListener("click",()=>{
  const play=$("#lb-play");
  if(lbState.kind==="video"){
    const v=lbState.el;
    if(v.paused){v.play();play.textContent="❚❚";}else{v.pause();play.textContent="▶";}
  }else if(lbState.kind==="gif"){
    const img=lbState.el;
    if(!lbState.frozen){
      const c=document.createElement("canvas");
      c.width=img.naturalWidth;c.height=img.naturalHeight;
      try{c.getContext("2d").drawImage(img,0,0);}catch(e){}
      c.style.maxWidth="96vw";c.style.maxHeight="82vh";c.style.borderRadius="8px";
      img.style.display="none";
      img.parentNode.appendChild(c);
      lbState.canvas=c;lbState.frozen=true;play.textContent="▶";
    }else{
      if(lbState.canvas)lbState.canvas.remove();
      lbState.el.style.display="";
      lbState.frozen=false;play.textContent="❚❚";
    }
  }
});
$("#lb-seek").addEventListener("input",e=>{
  if(lbState.kind==="video"&&lbState.el.duration){
    lbState.el.currentTime=(+e.target.value/1000)*lbState.el.duration;
  }
});

/* ============================================================
   GLOBAL BINDINGS
   ============================================================ */
function bindGlobal(){
  $("#brand").addEventListener("click",()=>showHome());
  // Catch failed media loads (images & videos) and show the failing path
  document.addEventListener("error",e=>{
    const el=e.target;
    if(!el||(el.tagName!=="IMG"&&el.tagName!=="VIDEO"))return;
    const wrap=el.closest(".media-item");
    if(!wrap||wrap.classList.contains("media-err"))return;
    wrap.classList.add("media-err");
    const path=el.getAttribute("data-src")||el.getAttribute("src")||"";
    console.warn("[cs2-lineups] media not found:",path);
    const msg=document.createElement("div");
    msg.className="media-err-msg";
    msg.innerHTML=`<span class="ic">⚠</span><span class="path">${esc(path)}</span><span class="hint">404 — ${LANG==="fr"?"fichier introuvable":"file not found"}</span>`;
    wrap.appendChild(msg);
  },true);
  $("#legend-toggle").addEventListener("click",()=>{
    const lg=$("#legend");const open=lg.classList.toggle("open");
    $("#legend-toggle").setAttribute("aria-expanded",open?"true":"false");
  });
  $("#btn-home").addEventListener("click",()=>showHome());
  $("#btn-lang").addEventListener("click",()=>{
    LANG=LANG==="en"?"fr":"en";
    localStorage.setItem("cs2_lang",LANG);
    renderChrome();
    if(state.map)renderAll();else renderHome();
  });
  $("#btn-edit").addEventListener("click",()=>{
    state.editMode=!state.editMode;
    state.placing=null;state.editingId=null;state.editingExecId=null;state.editingStratId=null;
    $("#mapwrap").classList.remove("placing");
    if(!state.editMode)state.openIds=[];
    state.edTab=state.viewMode==="strats"?"strats":"lineups";
    renderAll();
  });
  $("#lb-publish").addEventListener("click",publish);
  $("#lb-export").addEventListener("click",exportJSON);
  $("#lb-discard").addEventListener("click",()=>{
    confirmBox(t("discardT"),t("discardM"),()=>{
      localStorage.removeItem(STORE_KEY);localStorage.removeItem(SNAP_KEY);location.reload();
    });
  });
  $("#file-import").addEventListener("change",e=>{
    if(e.target.files[0])importJSON(e.target.files[0]);
    e.target.value="";
  });

  const wrap=$("#mapwrap");
  wrap.addEventListener("mousemove",e=>{
    const p=mapPoint(e);
    $("#coordbox").textContent=`x:${p.x} y:${p.y}`;
  });
  wrap.addEventListener("click",e=>{
    if(state.drawMode)return;
    if(state.editMode&&state.placing){
      const md=mapData();const p=mapPoint(e);
      if(state.placing==="spoint"&&state.editingStratId){
        const s=md.strats.find(x=>x.id===state.editingStratId);
        if(s){s.point=p;togglePlacing(null);state.placing=null;wrap.classList.remove("placing");save();toast(t("tZonePlaced"));renderAll();}
        return;
      }
      if(state.editingId){
        const l=md.lineups.find(x=>x.id===state.editingId);
        if(!l)return;
        if(state.placing==="land"){l.land=p;togglePlacing("throw");toast(t("tImpact"));}
        else{l.throw=p;togglePlacing(null);state.placing=null;wrap.classList.remove("placing");toast(t("tThrow"));}
        save();renderAll();
      }
      if(state.editingInstaId){
        const n=md.instas.find(x=>x.id===state.editingInstaId);
        if(!n)return;
        if(state.placing==="land"){n.land=p;togglePlacing("throw");toast(t("tImpact"));}
        else{n.throw=p;togglePlacing(null);state.placing=null;wrap.classList.remove("placing");toast(t("tThrow"));}
        save();renderAll();
      }
      return;
    }
    if(!state.editMode){
      if(state.openIds.length){state.openIds=[];renderAll();}
      else if(state.selectedStrat){state.selectedStrat=null;state.stratExpand=new Set();renderAll();}
    }
  });

  document.addEventListener("keydown",e=>{
    if($("#lightbox").classList.contains("show")){
      if(e.key==="Escape"){closeLightbox();return;}
      if(e.key==="ArrowLeft"){lbStep(-1);return;}
      if(e.key==="ArrowRight"){lbStep(1);return;}
      return;
    }
    if(e.key==="Escape"){
      if($("#modal").classList.contains("show")){closeModal();return;}
      if(state.drawMode){state.drawMode=false;$("#mapwrap").classList.remove("drawing");renderMapTools();return;}
      if(state.placing){state.placing=null;$("#mapwrap").classList.remove("placing");renderAll();return;}
      if(state.openIds.length||state.selectedStrat){state.openIds=[];state.selectedStrat=null;state.stratExpand=new Set();renderAll();}
    }
  });
}

/* ---------------- modal & toast ---------------- */
function showModal({title,html,buttons}){
  $("#modal-title").textContent=title;
  $("#modal-body").innerHTML=html;
  const acts=$("#modal-acts");acts.innerHTML="";
  (buttons||[]).forEach(b=>{
    const el=document.createElement("button");
    el.className=b.cls||"btn";el.textContent=b.label;
    el.addEventListener("click",async()=>{closeModal();if(b.onClick)await b.onClick();});
    acts.appendChild(el);
  });
  $("#modal").classList.add("show");
}
function confirmBox(title,msg,onYes){
  showModal({title,html:esc(msg),buttons:[
    {label:t("cancel"),cls:"btn"},
    {label:t("del"),cls:"btn btn-danger",onClick:onYes},
  ]});
}
function closeModal(){$("#modal").classList.remove("show");}
document.querySelector("#modal .back").addEventListener("click",closeModal);

let toastTimer=null;
function toast(msg){
  const el=$("#toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}
</script>
